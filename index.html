<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Matthew Lack, a programmer in Toronto. Projects in software and electronics, with notes on how they work.">
    <title>Matthew Lack</title>
    <style>
      html[data-portfolio-theme="dark"] { background: #0b0d0f; color-scheme: dark; }
      html[data-portfolio-theme="light"] { background: #fff; color-scheme: light; }
    </style>
    <script>
      try {
        const saved = localStorage.getItem('portfolio-theme');
        document.documentElement.dataset.portfolioTheme = saved === 'light' || saved === 'dark' ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch {
        document.documentElement.dataset.portfolioTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
    </script>
  </head>
  <body style="margin: 0;">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
