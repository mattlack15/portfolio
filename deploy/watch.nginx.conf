# Install after a DNS-only A record watch.mattlack.com points to this VPS
# and Certbot has issued /etc/letsencrypt/live/watch.mattlack.com/.
server {
    listen 80;
    server_name watch.mattlack.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://watch.mattlack.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name watch.mattlack.com;
    ssl_certificate /etc/letsencrypt/live/watch.mattlack.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/watch.mattlack.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location = / { return 302 /watch/; }
    location = /watch { return 302 /watch/; }
    location /watch/ {
        proxy_pass http://127.0.0.1:18766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 120s;
        client_max_body_size 1k;
        access_log off;
        add_header Cache-Control "private, no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_intercept_errors on;
        error_page 502 504 =503 /stream-offline;
    }
    location = /stream-offline {
        internal;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        return 503 '<!doctype html><meta name="viewport" content="width=device-width"><title>Stream offline</title><body style="background:#090c12;color:#f3f4f6;font:18px system-ui;padding:40px"><h1>Stream offline</h1><p>Matt needs to reconnect the stream. Refresh this page in a moment.</p>';
    }
    location / { return 404; }
}
